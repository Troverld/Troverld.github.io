name: Deploy Hugo to Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.169.0
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugo
        shell: bash
        run: |
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" -o "${RUNNER_TEMP}/hugo.tar.gz"
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_checksums.txt" -o "${RUNNER_TEMP}/checksums.txt"
          cd "${RUNNER_TEMP}"
          expected=$(awk -v name="hugo_${HUGO_VERSION}_linux-amd64.tar.gz" '$2 == name {print $1}' checksums.txt)
          test -n "$expected"
          echo "$expected  hugo.tar.gz" | sha256sum --check
          tar -xzf hugo.tar.gz hugo
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Check content and metadata contracts
        run: python3 -m unittest discover -s tests -v
      - name: Build
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
