<svg xmlns="http://www.w3.org/2000/svg" width="499" height="499" viewBox="0 0 499 499" role="img" aria-labelledby="title desc">
  <title id="title">DHMS</title>
  <desc id="desc">戴紫红色帽子、银灰色头发的人物，身穿蓝色上衣，一手握着金属门把手，另一手举起。</desc>
