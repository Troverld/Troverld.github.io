    <linearGradient id="hat" x1="40" y1="110" x2="310" y2="-35" gradientUnits="userSpaceOnUse"><stop stop-color="#94245f"/><stop offset="1" stop-color="#a12b66"/></linearGradient>
    <linearGradient id="hair" x1="110" y1="70" x2="330" y2="274" gradientUnits="userSpaceOnUse"><stop stop-color="#bfb9c3"/><stop offset=".52" stop-color="#c9c3cc"/><stop offset="1" stop-color="#c2bcc7"/></linearGradient>
    <linearGradient id="skin" x1="130" y1="130" x2="300" y2="300" gradientUnits="userSpaceOnUse"><stop stop-color="#fbd0ae"/><stop offset="1" stop-color="#fbcba9"/></linearGradient>
    <linearGradient id="shirt" x1="276" y1="272" x2="276" y2="490" gradientUnits="userSpaceOnUse"><stop stop-color="#1598b9"/><stop offset="1" stop-color="#119abb"/></linearGradient>
    <linearGradient id="metal" x1="118" y1="271" x2="153" y2="276" gradientUnits="userSpaceOnUse"><stop stop-color="#9b9682"/><stop offset=".16" stop-color="#d5cdb5"/><stop offset=".35" stop-color="#fff3d8"/><stop offset=".55" stop-color="#f5e9cc"/><stop offset=".78" stop-color="#b8b29d"/><stop offset="1" stop-color="#dfd7bd"/></linearGradient>
    <linearGradient id="bend" x1="155" y1="232" x2="159" y2="263" gradientUnits="userSpaceOnUse"><stop stop-color="#ddd7c2"/><stop offset=".22" stop-color="#fff4db"/><stop offset=".55" stop-color="#ddd4b8"/><stop offset=".86" stop-color="#b8b09b"/><stop offset="1" stop-color="#d8cdb2"/></linearGradient>
    <linearGradient id="plate" x1="187" y1="240" x2="220" y2="276" gradientUnits="userSpaceOnUse"><stop stop-color="#e1dcc9"/><stop offset=".45" stop-color="#d2cebb"/><stop offset="1" stop-color="#b9b6a3"/></linearGradient>
    <linearGradient id="plateTop" x1="181" y1="210" x2="200" y2="202" gradientUnits="userSpaceOnUse"><stop stop-color="#e3dcc8"/><stop offset=".5" stop-color="#eee5d2"/><stop offset="1" stop-color="#d4cdba"/></linearGradient>
